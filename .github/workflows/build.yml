name: Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: aarch64-linux-android

    - name: Install cargo-xdk
      run: cargo install cargo-xdk

    - name: Setup NDK
      uses: nttld/setup-ndk@v1
      id: setup-ndk
      with:
        ndk-version: r26d
        add-to-path: true

    - name: Download and convert rootfs
      run: |
        mkdir -p app/src/main/assets
        curl -L -o rootfs.7z "https://github.com/topminipie/twoyi/releases/download/0.7.5-rom/rootfs.7z"
        sudo apt-get update && sudo apt-get install -y p7zip-full
        7z x rootfs.7z -o./rootfs_extracted -snl
        cd rootfs_extracted/rootfs
        tar -czvf ../../app/src/main/assets/rootfs.tgz .
        cd ../..
        cp rootfs_extracted/rootfs/rom.ini app/src/main/assets/rom.ini
        rm -rf rootfs.7z rootfs_extracted

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      env:
        ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
      run: ./gradlew assembleRelease

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: twoyi-release
        path: app/build/outputs/apk/release/*.apk
        if-no-files-found: error
